<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: kite: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <link rel="stylesheet" href="../styles/base.css" />
    <style>
      /* The layer covers the window; the menus float on it, the rest is see-through */
      html,
      body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        margin: 0;
        width: 100vw;
        height: 100vh;
        cursor: default;
      }
      .km {
        position: fixed;
        min-width: 210px;
        max-width: 380px;
        padding: 5px;
        border-radius: var(--radius-lg, 10px);
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: 0 12px 32px -8px rgb(0 0 0 / 0.45), 0 2px 6px rgb(0 0 0 / 0.18);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        font-size: 13px;
        outline: none;
        transform-origin: var(--ox, top left);
        animation: km-in 120ms cubic-bezier(0.2, 0.9, 0.3, 1.1);
      }
      .no-anim .km {
        animation: none;
      }
      @keyframes km-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      .ki {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 30px;
        padding: 0 10px 0 8px;
        border-radius: calc(var(--radius-lg, 10px) - 4px);
        white-space: nowrap;
      }
      .ki .ck {
        width: 16px;
        flex: none;
        display: grid;
        place-items: center;
        color: var(--accent);
      }
      .ki .ck svg {
        width: 14px;
        height: 14px;
      }
      .ki .ck img {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }
      .nock .ki .ck {
        display: none;
      }
      .nock .ki {
        padding-left: 12px;
      }
      .nock .kh {
        padding-left: 12px;
      }
      .ki .lb {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ki .ac {
        margin-left: 18px;
        color: var(--muted);
        font-size: 11.5px;
        letter-spacing: 0.02em;
      }
      .ki .ar {
        width: 14px;
        height: 14px;
        margin-right: -4px;
        color: var(--muted);
      }
      .ki.on {
        background: var(--accent-soft, var(--surface-3));
      }
      .ki.on .ac,
      .ki.on .ar {
        color: var(--text);
      }
      .ki.dis {
        opacity: 0.42;
      }
      .ki.dis.on {
        background: transparent;
      }
      .ki.danger .lb {
        color: var(--danger, #e5484d);
      }
      .ks {
        height: 1px;
        margin: 5px 8px;
        background: var(--border);
      }
      .kh {
        padding: 6px 10px 4px 32px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <script src="menu.js"></script>
  </body>
</html>
